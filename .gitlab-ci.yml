# CWSO CI/CD pipeline.
#
# Stages:
#   * lint   — go vet, gofmt check, cargo fmt --check
#   * build  — orchestrator (Go) + cwso-git-shadow (Rust) Docker images
#   * test   — go test -race + cargo test (release)
#   * e2e    — docker-compose-driven Phase-2 integration test
#   * deploy — placeholder for future container registry pushes
#
# Runner layout (Option A — Docker socket binding):
#   * tag `docker` — lint / test / audit (no Docker daemon required)
#   * tag `dind`   — build / e2e / deploy (runner mounts /var/run/docker.sock)
#
# Do NOT set DOCKER_TLS_CERTDIR globally; that forces tcp://docker:2375 (DinD).

stages:
  - lint
  - build
  - test
  - audit
  - e2e
  - deploy

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  # Cache cargo registry across jobs.
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  GOPATH: "$CI_PROJECT_DIR/.gopath"

default:
  interruptible: true
  tags: [docker]

# Shared template for jobs that talk to the host Docker daemon via socket.
.docker-socket:
  tags: [dind]
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock

# -----------------------------------------------------------------------------
# Lint
# -----------------------------------------------------------------------------

# Version drift guard (C001): README "Current state" must match the newest
# CHANGELOG entry. Fully offline; runs the extraction rules documented in
# scripts/check-version-drift.sh.
check:version-drift:
  stage: lint
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash grep sed >/dev/null
  script:
    - bash scripts/check-version-drift.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

go:lint:
  stage: lint
  image: golang:1.25.13
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gopath/pkg/mod]
  script:
    - cd orchestrator
    - test -z "$(gofmt -l .)" || (echo 'gofmt issues:' && gofmt -d . && exit 1)
    - go vet ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

rust:lint:
  stage: lint
  image: rust:1.87
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths: [.cargo, services/target]
  script:
    - cd services
    - rustup component add rustfmt clippy
    - cargo fmt --all -- --check
  allow_failure: true   # PoC phase: clippy/fmt warnings should not block.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# -----------------------------------------------------------------------------
# Test
# -----------------------------------------------------------------------------

go:test:
  stage: test
  image: golang:1.25.13
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gopath/pkg/mod]
  variables:
    CGO_ENABLED: "1"
  script:
    - cd orchestrator
    - go test ./... -race -coverprofile=coverage.out -covermode=atomic
    - go tool cover -func=coverage.out | tail -1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    paths: [orchestrator/coverage.out]
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

rust:test:
  stage: test
  image: rust:1.87-slim
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths: [.cargo, services/target]
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq build-essential pkg-config cmake ca-certificates >/dev/null
  script:
    - cd services
    - cargo test --release -p cwso-git-shadow
    - cargo test --release -p cwso-merge-engine
    - cargo test --release -p cwso-hal
    - cargo test --release -p cwso-sparse
    - cargo test --release -p cwso-rollout
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# -----------------------------------------------------------------------------
# Dependency audit (T094)
# -----------------------------------------------------------------------------
# Scans Go and Rust dependency trees for known vulnerabilities. Blocking gate
# since T140 (v0.3.0 GA hardening); rust:lint remains advisory.

go:audit:
  stage: audit
  image: golang:1.25.13
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gopath/pkg/mod]
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - cd orchestrator
    - $GOPATH/bin/govulncheck ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

rust:audit:
  stage: audit
  image: rust:1.87
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths: [.cargo, services/target]
  script:
    - cargo install cargo-audit --locked --version 0.22.1
    - cd services
    - cargo audit
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# -----------------------------------------------------------------------------
# Build container images
# -----------------------------------------------------------------------------

.docker-base:
  extends: .docker-socket
  stage: build
  image: docker:27
  before_script:
    - docker info >/dev/null

build:orchestrator:
  extends: .docker-base
  script:
    - docker build -t $CI_REGISTRY_IMAGE/orchestrator:$CI_COMMIT_SHORT_SHA -f deploy/Dockerfile.orchestrator .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

build:git-shadow:
  extends: .docker-base
  script:
    - docker build -t $CI_REGISTRY_IMAGE/git-shadow:$CI_COMMIT_SHORT_SHA -f deploy/Dockerfile.git-shadow .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

build:merge-engine:
  extends: .docker-base
  script:
    - docker build -t $CI_REGISTRY_IMAGE/merge-engine:$CI_COMMIT_SHORT_SHA -f deploy/Dockerfile.merge-engine .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

build:rollout:
  extends: .docker-base
  script:
    - docker build -t $CI_REGISTRY_IMAGE/rollout:$CI_COMMIT_SHORT_SHA -f deploy/Dockerfile.rollout .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# -----------------------------------------------------------------------------
# End-to-end integration tests
# -----------------------------------------------------------------------------

.e2e-base:
  extends: .docker-socket
  stage: e2e
  image: docker:27
  variables:
    CWSO_JWT_SECRET: "ci-ephemeral-secret-not-used-in-prod-ci-only"
  before_script:
    - apk add --no-cache python3 docker-cli-compose iproute2
    # JWT is injected via deploy/docker-compose.ci.yml (avoids host bind-mount path issues).
    # Compose publishes 8080 on the host; reach it via the container default gateway.
    - export CWSO_BASE_URL="http://$(ip route | awk '/default/ {print $3}'):8080"
    - docker info >/dev/null
  script:
    - python3 scripts/phase2-integration.py

e2e:phase2:
  extends: .e2e-base
  needs: ["build:orchestrator", "build:git-shadow"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

e2e:phase4-swarm:
  extends: .e2e-base
  needs: ["build:orchestrator", "build:git-shadow", "build:merge-engine", "e2e:phase2"]
  variables:
    CWSO_JWT_SECRET: "ci-ephemeral-secret-not-used-in-prod-ci-only"
    CWSO_COMPOSE_PROFILES: "phase2,phase4"
    CWSO_PHASE4_MATRIX: "1"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# C018: v1.0 definition-of-done executable. Drives the full real flow over
# the MCP HTTP transport with a minted token: health -> create_shadow_workspace
# -> write_shadow_file -> query_ast -> commit_shadow -> merge_concurrent_results
# -> teardown. See scripts/cwso-smoke-test.sh for the stage-by-stage
# assertions and its own EXIT-trap teardown (containers + volumes), which
# runs regardless of this job's outcome.
e2e:smoke:
  extends: .docker-socket
  stage: e2e
  image: docker:27
  needs: ["build:orchestrator", "build:git-shadow", "build:merge-engine"]
  variables:
    CWSO_JWT_SECRET: "ci-ephemeral-secret-not-used-in-prod-ci-only"
  before_script:
    - apk add --no-cache bash curl python3 docker-cli-compose iproute2
    - docker info >/dev/null
    # Compose publishes 8080 on the host; reach it via the container default
    # gateway (same resolution .e2e-base uses for the phase2/phase4 suites).
    - export CWSO_BASE_URL="http://$(ip route | awk '/default/ {print $3}'):8080"
    # scripts/cwso-token.sh runs directly on this job container (not inside a
    # docker container) and signs with the trimmed content of .env.jwt.dev.
    # Under CI's docker-socket-binding runner (Option A), the orchestrator
    # container itself gets its JWT secret from the CWSO_JWT_SECRET env var,
    # not from this file -- deploy/docker-compose.ci.yml already routes
    # around the file-based secret for exactly that reason (see its header
    # comment: bind-mount sources aren't visible to the remote dind daemon).
    # Writing a *local* .env.jwt.dev with the identical raw value here only
    # feeds cwso-token.sh so the tokens it mints verify against that same
    # env-var secret; it does not change how the orchestrator container
    # itself resolves its secret.
    - printf '%s' "$CWSO_JWT_SECRET" > .env.jwt.dev
    - docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml build
    - docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml up -d
  script:
    - bash scripts/cwso-smoke-test.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# -----------------------------------------------------------------------------
# Deploy (placeholder)
# -----------------------------------------------------------------------------

deploy:registry:
  extends: .docker-socket
  stage: deploy
  image: docker:27
  needs:
    - job: build:orchestrator
    - job: build:git-shadow
    - job: build:merge-engine
    - job: build:rollout
    - job: e2e:phase2
      optional: true   # T153: e2e excluded on tag pipelines; develop/main still gate deploy
  before_script:
    - docker info >/dev/null
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  # Use buildx --push to upload all blobs atomically during build.
  # --provenance=false avoids attestation manifests that cause "blob unknown"
  # errors when the tag-then-push path is used with the containerd image store.
  script:
    - |
      push_image() {
        local svc="$1"
        local dockerfile="$2"
        local tags="-t ${CI_REGISTRY_IMAGE}/${svc}:latest"
        [ -n "$CI_COMMIT_TAG" ] && tags="${tags} -t ${CI_REGISTRY_IMAGE}/${svc}:${CI_COMMIT_TAG}"
        docker buildx build ${tags} -f "${dockerfile}" --provenance=false --push .
      }
      push_image orchestrator deploy/Dockerfile.orchestrator
      push_image git-shadow   deploy/Dockerfile.git-shadow
      push_image merge-engine deploy/Dockerfile.merge-engine
      push_image rollout      deploy/Dockerfile.rollout
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
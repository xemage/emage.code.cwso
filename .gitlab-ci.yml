# CWSO CI/CD pipeline.
#
# Stages:
#   * lint   — go vet, gofmt check, cargo fmt --check
#   * build  — orchestrator (Go) + cwso-git-shadow (Rust) Docker images
#   * test   — go test -race + cargo test (release)
#   * e2e    — docker-compose-driven Phase-2 integration test
#   * deploy — placeholder for future container registry pushes
#
# Runner layout (Option A — Docker socket binding):
#   * tag `docker` — lint / test / audit (no Docker daemon required)
#   * tag `dind`   — build / e2e / deploy (runner mounts /var/run/docker.sock)
#
# Do NOT set DOCKER_TLS_CERTDIR globally; that forces tcp://docker:2375 (DinD).
#
# Image pins (T728, SEC-T696-04): every image below, in deploy/Dockerfile.*,
# deploy/docker-compose.yml and scripts/release-assets.sh is pinned as
# `<tag>@sha256:<index digest>`; the tag is for humans, the digest is what is
# pulled. To update, read the new digest from the registry
# (`docker buildx imagetools inspect <tag>`), change tag and digest together
# in every file, and run scripts/check-image-pins.sh. One Rust toolchain
# (SEC-T696-02, SEC-T695-09): rust:1.99.1 (released 2026-10-15) in CI, in the
# Rust Dockerfiles and in scripts/release-assets.sh.

stages:
  - lint
  - build
  - test
  - audit
  - e2e
  - deploy

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  # Cache cargo registry across jobs.
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  GOPATH: "$CI_PROJECT_DIR/.gopath"

default:
  interruptible: true
  tags: [docker]

# Shared template for jobs that talk to the host Docker daemon via socket.
.docker-socket:
  tags: [dind]
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock

# T695: per-job JWT signing secret for the e2e jobs. The orchestrator under
# test gets it through deploy/docker-compose.ci.yml (`CWSO_JWT_SECRET:
# ${CWSO_JWT_SECRET}`), and the token minting in scripts/phase2-integration.py
# and scripts/cwso-token.sh signs with the same value, so any random value
# works and no fixed secret is needed: each job generates 32 random bytes
# (hex, 64 characters) at run time. The value lives only in the job's shell
# and the containers it starts; GitLab prints the command text, not the
# expanded value. Never put a literal secret here again (a committed value
# was rotated on 2026-10-31). Same generator as the fallback in
# scripts/cwso-bootstrap-secrets.sh; busybox `od` is in every docker:27 image.
.ci-jwt-secret:
  script:
    - export CWSO_JWT_SECRET="$(head -c 32 /dev/urandom | od -A n -t x1 | tr -d ' \n')"
    - test "${#CWSO_JWT_SECRET}" -eq 64

# -----------------------------------------------------------------------------
# Lint
# -----------------------------------------------------------------------------

# Version drift guard (C001): README "Current state" must match the newest
# CHANGELOG entry. Fully offline; runs the extraction rules documented in
# scripts/check-version-drift.sh.
check:version-drift:
  stage: lint
  image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  before_script:
    - apk add --no-cache bash grep sed >/dev/null
  script:
    - bash scripts/check-version-drift.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# T728 (SEC-T696-04, SEC-T695-09): every external image is pinned by digest,
# and CI, the Dockerfiles and scripts/release-assets.sh name one Rust and one
# Go version. Offline; see scripts/check-image-pins.sh.
check:image-pins:
  stage: lint
  image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  before_script:
    - apk add --no-cache bash grep sed >/dev/null
  script:
    - bash scripts/check-image-pins.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

go:lint:
  stage: lint
  image: golang:1.26.10@sha256:670bb5aa5349ae03b8516764718486f4f16399134bdc9acd0c46a23f043ab05c
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gopath/pkg/mod]
  script:
    - cd orchestrator
    - test -z "$(gofmt -l .)" || (echo 'gofmt issues:' && gofmt -d . && exit 1)
    - go vet ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

rust:lint:
  stage: lint
  image: rust:1.99.1@sha256:09027f873d45b8ecd1dc86f1fa13b7a62b875c961f017a0e331267b350430137
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths: [.cargo, services/target]
  script:
    - cd services
    - rustup component add rustfmt clippy
    - cargo fmt --all -- --check
  allow_failure: true   # PoC phase: clippy/fmt warnings should not block.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# -----------------------------------------------------------------------------
# Test
# -----------------------------------------------------------------------------

go:test:
  stage: test
  image: golang:1.26.10@sha256:670bb5aa5349ae03b8516764718486f4f16399134bdc9acd0c46a23f043ab05c
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gopath/pkg/mod]
  variables:
    CGO_ENABLED: "1"
  script:
    - cd orchestrator
    - go test ./... -race -coverprofile=coverage.out -covermode=atomic
    - go tool cover -func=coverage.out | tail -1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    paths: [orchestrator/coverage.out]
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# C034: MCP protocol contract snapshot. Dedicated job (separate from go:test,
# which also runs this test as part of `./...`) so protocol-surface drift
# gets its own clearly-labeled, fast-feedback pipeline signal rather than
# being buried in the full suite. Compares the live method/notification/
# error-code/tool-schema surface against the committed golden fixture
# (internal/server/testdata/mcp_contract_snapshot_v1.json) and fails if they
# differ. Never passes -update-snapshot — drift must fail the pipeline, not
# self-heal; the fixture can only be regenerated deliberately via
# `make mcp-contract-snapshot-update`, run locally and committed as a
# reviewable diff.
go:mcp-contract-snapshot:
  stage: test
  image: golang:1.26.10@sha256:670bb5aa5349ae03b8516764718486f4f16399134bdc9acd0c46a23f043ab05c
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gopath/pkg/mod]
  script:
    - cd orchestrator
    - go test ./internal/server/... -run TestMCPContractSnapshot -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

rust:test:
  stage: test
  image: rust:1.99.1-slim-trixie@sha256:b8e062b1c3a80183df83d9ba187cadd2b5ab84bc78d453dbfeb2fccd5f982247
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths: [.cargo, services/target]
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq build-essential pkg-config cmake ca-certificates >/dev/null
  script:
    - cd services
    - cargo test --release --locked -p cwso-git-shadow
    - cargo test --release --locked -p cwso-merge-engine
    - cargo test --release --locked -p cwso-hal
    - cargo test --release --locked -p cwso-sparse
    - cargo test --release --locked -p cwso-rollout
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# -----------------------------------------------------------------------------
# Dependency audit (T094)
# -----------------------------------------------------------------------------
# Scans Go and Rust dependency trees for known vulnerabilities. Blocking gate
# since T140 (v0.3.0 GA hardening); rust:lint remains advisory.

go:audit:
  stage: audit
  image: golang:1.26.10@sha256:670bb5aa5349ae03b8516764718486f4f16399134bdc9acd0c46a23f043ab05c
  cache:
    key: go-mod-$CI_COMMIT_REF_SLUG
    paths: [.gopath/pkg/mod]
  script:
    # Pinned, not @latest (T695, T696): v1.9.0 declares `go 1.26.0` and runs on
    # golang:1.26.10 above. Raise this pin together with the golang image.
    - go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
    - cd orchestrator
    - $GOPATH/bin/govulncheck ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

rust:audit:
  stage: audit
  image: rust:1.99.1@sha256:09027f873d45b8ecd1dc86f1fa13b7a62b875c961f017a0e331267b350430137
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths: [.cargo, services/target]
  script:
    - cargo install cargo-audit --locked --version 0.22.1
    - cd services
    - cargo audit
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# SEC-C044-002 (follow-up security review of C044): scripts/check-ipc-gid-drift.sh
# (see SECURITY.md, "Sidecar IPC authorization" point 4, and docs/DEBT-REGISTER.md
# row R-7) existed and worked but was never wired into CI, so a future orchestrator
# image rebuild that shifts the `cwso` uid/gid again (the exact class of drift T197
# fixed once already) could silently reintroduce the same problem with no automated
# signal. Unlike go:audit/rust:audit above, this script needs a live Docker daemon —
# it runs `docker build`/`docker run --rm --entrypoint id cwso/orchestrator:dev cwso`
# internally (builds the orchestrator image itself if not already present locally) —
# so it needs the `.docker-socket` (`dind`-tagged) runner and a docker-cli image, the
# same infrastructure build:orchestrator/.docker-base use below, not the plain
# `docker`-tagged golang/rust images the other two audit jobs use.
security:ipc-gid-drift:
  extends: .docker-socket
  stage: audit
  image: docker:27.5.1@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  before_script:
    - apk add --no-cache bash
    - docker info >/dev/null
  script:
    - bash scripts/check-ipc-gid-drift.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# T728 (SEC-T696-03): OS-package scan of the four service images with Trivy.
# Scans the images build:* tagged on the shared daemon (builds one itself if
# it is missing, like security:ipc-gid-drift) and fails on a HIGH or CRITICAL
# OS-package vulnerability that has a fixed version; such a finding means the
# pinned base digest must be raised. Language packages are left to go:audit
# and rust:audit. Trivy runs as one container on the daemon (socket binding,
# so the -v source is the daemon host's own socket) and downloads its
# vulnerability DB once per job. Trivy is pinned by digest: v0.69.4 to
# v0.69.6 images were compromised in March 2026 (GHSA-69fq-xp46-6x23);
# 0.76.0 was released 2026-10-14, and its digest is the same on GHCR,
# Docker Hub and ECR Public.
security:image-scan:
  extends: .docker-socket
  stage: audit
  image: docker:27.5.1@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  needs: ["build:orchestrator", "build:git-shadow", "build:merge-engine", "build:rollout"]
  variables:
    TRIVY_IMAGE: "ghcr.io/aquasecurity/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222"
  before_script:
    - docker info >/dev/null
  script:
    - |
      refs=""
      for svc in orchestrator git-shadow merge-engine rollout; do
        ref="$CI_REGISTRY_IMAGE/$svc:$CI_COMMIT_SHORT_SHA"
        docker image inspect "$ref" >/dev/null 2>&1 || docker build -t "$ref" -f "deploy/Dockerfile.$svc" .
        refs="$refs $ref"
      done
      docker run --rm -v /var/run/docker.sock:/var/run/docker.sock --entrypoint sh "$TRIVY_IMAGE" -c '
        rc=0
        for ref in "$@"; do
          echo "==> trivy: $ref"
          trivy image --image-src docker --scanners vuln --pkg-types os --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$ref" || rc=1
        done
        exit $rc' sh $refs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# -----------------------------------------------------------------------------
# Build container images
# -----------------------------------------------------------------------------

.docker-base:
  extends: .docker-socket
  stage: build
  image: docker:27.5.1@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  before_script:
    - docker info >/dev/null

build:orchestrator:
  extends: .docker-base
  script:
    - docker build -t $CI_REGISTRY_IMAGE/orchestrator:$CI_COMMIT_SHORT_SHA -f deploy/Dockerfile.orchestrator .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

build:git-shadow:
  extends: .docker-base
  script:
    - docker build -t $CI_REGISTRY_IMAGE/git-shadow:$CI_COMMIT_SHORT_SHA -f deploy/Dockerfile.git-shadow .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

build:merge-engine:
  extends: .docker-base
  script:
    - docker build -t $CI_REGISTRY_IMAGE/merge-engine:$CI_COMMIT_SHORT_SHA -f deploy/Dockerfile.merge-engine .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

build:rollout:
  extends: .docker-base
  script:
    - docker build -t $CI_REGISTRY_IMAGE/rollout:$CI_COMMIT_SHORT_SHA -f deploy/Dockerfile.rollout .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# -----------------------------------------------------------------------------
# End-to-end integration tests
# -----------------------------------------------------------------------------

# T728 (SEC-T695-05): every e2e job runs its stack as its own Compose
# project, `cwso-ci-<job id>` (COMPOSE_PROJECT_NAME beats the `name: cwso` of
# deploy/docker-compose.yml), and deploy/docker-compose.ci.yml drops the fixed
# `container_name:`s, so containers are `cwso-ci-<job id>-<service>-1` and
# volumes `cwso-ci-<job id>_<volume>`. Every `docker compose` call of the job,
# its scripts and its after_script inherits the variable, so no CI job
# touches a non-CI `cwso` stack on the shared daemon.
.e2e-project:
  variables:
    COMPOSE_PROJECT_NAME: "cwso-ci-$CI_JOB_ID"
    # scripts/cwso-projection-e2e.sh `docker exec`s into git-shadow by name.
    CWSO_GIT_SHADOW_CONTAINER: "cwso-ci-$CI_JOB_ID-git-shadow-1"

# T695: the jobs share one Docker daemon and all publish port 8080, so the
# resource group `cwso-e2e-docker` runs them one at a time, across pipelines
# too. Each job first removes the stacks of earlier, killed CI jobs (a left-
# over stack would hold port 8080). T728: only projects named
# `cwso-ci-<digits>` are removed, never a `cwso` stack; while this job holds
# the resource group no other e2e job is running, so none of them is live.
.e2e-stale-cleanup:
  script:
    - for p in $(docker compose ls -a -q --filter name=cwso-ci- | grep -E '^cwso-ci-[0-9]+$' || true); do docker compose -p "$p" down -v --remove-orphans; done

.e2e-base:
  extends: [.docker-socket, .e2e-project]
  stage: e2e
  image: docker:27.5.1@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  resource_group: cwso-e2e-docker
  before_script:
    - apk add --no-cache python3 docker-cli-compose iproute2
    - !reference [.ci-jwt-secret, script]
    # JWT is injected via deploy/docker-compose.ci.yml (avoids host bind-mount path issues).
    # Compose publishes 8080 on the host; reach it via the container default gateway.
    - export CWSO_BASE_URL="http://$(ip route | awk '/default/ {print $3}'):8080"
    - docker info >/dev/null
    - !reference [.e2e-stale-cleanup, script]
  script:
    - python3 scripts/phase2-integration.py

e2e:phase2:
  extends: .e2e-base
  needs: ["build:orchestrator", "build:git-shadow"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

e2e:phase4-swarm:
  extends: .e2e-base
  needs: ["build:orchestrator", "build:git-shadow", "build:merge-engine", "e2e:phase2"]
  variables:
    CWSO_COMPOSE_PROFILES: "phase2,phase4"
    CWSO_PHASE4_MATRIX: "1"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# C018: v1.0 definition-of-done executable. Drives the full real flow over
# the MCP HTTP transport with a minted token: health -> create_shadow_workspace
# -> write_shadow_file -> query_ast -> commit_shadow -> merge_concurrent_results
# -> teardown. See scripts/cwso-smoke-test.sh for the stage-by-stage
# assertions and its own EXIT-trap teardown (containers + volumes), which
# runs regardless of this job's outcome.
e2e:smoke:
  extends: [.docker-socket, .e2e-project]
  stage: e2e
  image: docker:27.5.1@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  resource_group: cwso-e2e-docker  # T695: see .e2e-base
  needs: ["build:orchestrator", "build:git-shadow", "build:merge-engine"]
  before_script:
    - apk add --no-cache bash curl python3 docker-cli-compose iproute2
    - !reference [.ci-jwt-secret, script]
    - docker info >/dev/null
    - !reference [.e2e-stale-cleanup, script]
    # Compose publishes 8080 on the host; reach it via the container default
    # gateway (same resolution .e2e-base uses for the phase2/phase4 suites).
    - export CWSO_BASE_URL="http://$(ip route | awk '/default/ {print $3}'):8080"
    # scripts/cwso-token.sh runs directly on this job container (not inside a
    # docker container) and signs with the trimmed content of .env.jwt.dev.
    # Under CI's docker-socket-binding runner (Option A), the orchestrator
    # container itself gets its JWT secret from the CWSO_JWT_SECRET env var,
    # not from this file -- deploy/docker-compose.ci.yml already routes
    # around the file-based secret for exactly that reason (see its header
    # comment: bind-mount sources aren't visible to the remote dind daemon).
    # Writing a *local* .env.jwt.dev with the identical raw value here only
    # feeds cwso-token.sh so the tokens it mints verify against that same
    # env-var secret; it does not change how the orchestrator container
    # itself resolves its secret.
    - (umask 077 && printf '%s' "$CWSO_JWT_SECRET" > .env.jwt.dev)
    - docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml build
    - docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml up -d
  script:
    - bash scripts/cwso-smoke-test.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# C024: CG2 close-out. Unlike e2e:smoke above (which drives every stage over
# the MCP HTTP transport and never touches the real filesystem path),
# e2e:projection proves the real, projected shadow-workspace path
# (<storage_root>/<workspace-uuid>/, ADR-012/C021) is reachable and usable
# by ordinary shell tooling: docker exec into the running cwso-git-shadow
# container, `ls`/`cat` the real path, run a real (precompiled) `go test`
# binary against it, `sed` a file in place (bypassing every CWSO tool), then
# assert commit_shadow (over MCP) captures the edit. See
# scripts/cwso-projection-e2e.sh's own header for the full stage-by-stage
# breakdown and for why the "real test command" stage stages its binary
# under /run/cwso rather than executing in place (the shadow-storage tmpfs
# mount is `noexec` by Docker's own default -- confirmed live, independent
# of the runtime image's own missing language toolchains).
#
# This job does not reuse .e2e-base/e2e:smoke's own EXIT-trap-based compose
# teardown pattern: cwso-projection-e2e.sh's own verification recipe
# (docs/tasks/task-C024.md) is `make up; script; make down` -- the script
# itself only cleans up the one shadow workspace + staged test binary it
# creates, so this job's after_script owns tearing down the compose stack,
# matching that recipe exactly (and running regardless of script exit code,
# same guarantee e2e:smoke's own trap gives it).
e2e:projection:
  extends: [.docker-socket, .e2e-project]
  stage: e2e
  image: docker:27.5.1@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  resource_group: cwso-e2e-docker  # T695: see .e2e-base
  needs: ["build:orchestrator", "build:git-shadow", "build:merge-engine"]
  before_script:
    - apk add --no-cache bash curl python3 docker-cli-compose iproute2
    - !reference [.ci-jwt-secret, script]
    - docker info >/dev/null
    - !reference [.e2e-stale-cleanup, script]
    - export CWSO_BASE_URL="http://$(ip route | awk '/default/ {print $3}'):8080"
    # Same rationale as e2e:smoke above: local .env.jwt.dev only feeds
    # scripts/cwso-token.sh; the orchestrator container itself resolves its
    # JWT secret from CWSO_JWT_SECRET via deploy/docker-compose.ci.yml.
    - (umask 077 && printf '%s' "$CWSO_JWT_SECRET" > .env.jwt.dev)
    - docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml build
    - docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml up -d
  script:
    - bash scripts/cwso-projection-e2e.sh
  after_script:
    - docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml down -v --remove-orphans
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# -----------------------------------------------------------------------------
# Deploy (placeholder)
# -----------------------------------------------------------------------------

deploy:registry:
  extends: .docker-socket
  stage: deploy
  image: docker:27.5.1@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  needs:
    - job: build:orchestrator
    - job: build:git-shadow
    - job: build:merge-engine
    - job: build:rollout
    - job: e2e:phase2
      optional: true   # T153: e2e excluded on tag pipelines; develop/main still gate deploy
  before_script:
    - docker info >/dev/null
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  # Use buildx --push to upload all blobs atomically during build.
  # --provenance=false avoids attestation manifests that cause "blob unknown"
  # errors when the tag-then-push path is used with the containerd image store.
  script:
    - |
      push_image() {
        local svc="$1"
        local dockerfile="$2"
        local tags="-t ${CI_REGISTRY_IMAGE}/${svc}:latest"
        [ -n "$CI_COMMIT_TAG" ] && tags="${tags} -t ${CI_REGISTRY_IMAGE}/${svc}:${CI_COMMIT_TAG}"
        docker buildx build ${tags} -f "${dockerfile}" --provenance=false --push .
      }
      push_image orchestrator deploy/Dockerfile.orchestrator
      push_image git-shadow   deploy/Dockerfile.git-shadow
      push_image merge-engine deploy/Dockerfile.merge-engine
      push_image rollout      deploy/Dockerfile.rollout
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
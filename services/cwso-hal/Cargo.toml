[package]
name = "cwso-hal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "cwso-hal"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ureq = { version = "2", features = ["json", "tls"] }

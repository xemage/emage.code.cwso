[package]
name = "cwso-sparse"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "cwso-sparse"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
# Pin to >= 0.9.20 to fix RUSTSEC-2026-0204 (invalid ptr deref in fmt::Pointer).
# Transitive path: wasmtime -> rayon-core -> crossbeam-deque -> crossbeam-epoch.
crossbeam-epoch = "0.9.20"
hex = "0.4"
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
wasmtime = "36"

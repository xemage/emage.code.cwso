[package]
name = "cwso-sparse"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "cwso-sparse"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

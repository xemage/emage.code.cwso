name: cwso

secrets:
  jwt_secret:
    file: ../.env.jwt.dev  # T029: Production must use secure secret management (Vault/SOPS)
    # POC-DEBT: File-based secret acceptable for dev/compose; prod needs external vault

services:
  orchestrator:
    image: cwso/orchestrator:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.orchestrator
    container_name: cwso-orchestrator
    ports:
      - "8080:8080"
    environment:
      CWSO_TRANSPORT: "http"
      CWSO_HTTP_ADDR: ":8080"
      CWSO_LOG_LEVEL: "info"
      CWSO_JWT_ALG: "HS256"  # RS256 is not supported in this build
      CWSO_JWT_ISSUER: "cwso"
      CWSO_JWT_AUDIENCE: "cwso-mcp"
      CWSO_ALLOWED_ORIGINS: "http://localhost,http://127.0.0.1,http://localhost:8080,http://docker:8080"
      CWSO_WORKSPACE: "/workspace"
      CWSO_GIT_SHADOW_SOCKET: "/run/cwso/git-shadow.sock"
      CWSO_MERGE_ENGINE_SOCKET: "/run/cwso/merge-engine.sock"
      CWSO_DASHBOARD_TOKEN: "${CWSO_DASHBOARD_TOKEN:-}"
      # --- C014: folded from scripts/cwso-enable-all-features.sh (deprecated) ---
      # Phase 6: hardware-aware dispatch (orchestrator/internal/config/config.go).
      # CWSO_HAL_SOCKET points at a cwso-hal sidecar socket path; no such service is
      # defined in this compose file, so hardware-aware dispatch degrades to shadow
      # mode (see the field comment on Config.HALSocket) rather than failing startup.
      CWSO_HAL_SOCKET: "/run/cwso/hal.sock"
      CWSO_HHD_CAPABILITY_REGISTRY_ENABLED: "${CWSO_HHD_CAPABILITY_REGISTRY_ENABLED:-true}"
      CWSO_HHD_DECISION_TELEMETRY_ENABLED: "${CWSO_HHD_DECISION_TELEMETRY_ENABLED:-true}"
      CWSO_HHD_TELEMETRY_REDACTION_ENABLED: "${CWSO_HHD_TELEMETRY_REDACTION_ENABLED:-true}"
      CWSO_HHD_POLICY_ENGINE_V2_ENABLED: "${CWSO_HHD_POLICY_ENGINE_V2_ENABLED:-true}"
      CWSO_HHD_HARDWARE_AWARE_DISPATCH_ENABLED: "${CWSO_HHD_HARDWARE_AWARE_DISPATCH_ENABLED:-true}"
      CWSO_HHD_EVENT_MONITOR_ENABLED: "${CWSO_HHD_EVENT_MONITOR_ENABLED:-true}"
      # eBPF requires host kernel privileges not granted to this container
      # (cap_drop: ALL); keep off by default same as the deprecated script.
      CWSO_HHD_EVENT_MONITOR_EBPF_ENABLED: "${CWSO_HHD_EVENT_MONITOR_EBPF_ENABLED:-false}"
      # Optional assists — each requires extra assets/backends not provisioned by this
      # compose file (WASM module path/hash, SSM/quantized backends); off by default
      # same as the deprecated script.
      CWSO_HHD_SPARSE_QUANTIZED_ASSIST_ENABLED: "${CWSO_HHD_SPARSE_QUANTIZED_ASSIST_ENABLED:-false}"
      CWSO_HHD_SSM_ASSIST_ENABLED: "${CWSO_HHD_SSM_ASSIST_ENABLED:-false}"
      CWSO_HHD_WASM_SCORING_ENABLED: "${CWSO_HHD_WASM_SCORING_ENABLED:-false}"
      # Phase 7: sparse micro-agents + AST spike monitor.
      # CWSO_SPARSE_SOCKET has no listening cwso-sparse service in this compose file
      # (same limitation as CWSO_HAL_SOCKET above); config.go requires it non-empty
      # whenever CWSO_SPARSE_AGENTS_ENABLED=true, so it must stay paired with it.
      CWSO_SPARSE_AGENTS_ENABLED: "${CWSO_SPARSE_AGENTS_ENABLED:-true}"
      CWSO_SPARSE_SOCKET: "/run/cwso/sparse.sock"
      CWSO_SPARSE_QUALITY_GUARDRAIL_ENABLED: "${CWSO_SPARSE_QUALITY_GUARDRAIL_ENABLED:-true}"
      CWSO_AST_SPIKE_MONITOR_ENABLED: "${CWSO_AST_SPIKE_MONITOR_ENABLED:-true}"
      CWSO_AST_SPIKE_RESOURCES_ENABLED: "${CWSO_AST_SPIKE_RESOURCES_ENABLED:-true}"
      # Phase 9: rollout / Polar (orchestrator-side flags; cwso-rollout sidecar's own
      # proxy env lives on the `rollout` service block below, unchanged from C011).
      CWSO_ROLLOUT_API_ENABLED: "${CWSO_ROLLOUT_API_ENABLED:-true}"
      CWSO_ROLLOUT_REWARD_ENABLED: "${CWSO_ROLLOUT_REWARD_ENABLED:-true}"
      CWSO_ROLLOUT_KV_PREFIX_ROUTER_ENABLED: "${CWSO_ROLLOUT_KV_PREFIX_ROUTER_ENABLED:-true}"
      CWSO_ROLLOUT_SOCKET: "/run/cwso/rollout.sock"
    secrets:
      - jwt_secret
    volumes:
      - ../sample-workspace:/workspace:ro
      - cwso-runtime:/run/cwso
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m
    # C019: the orchestrator publishes 8080 and dials the docker socket path
    # configured by CWSO_DOCKER_HOST when CWSO_SANDBOX_RUNNER is enabled, so
    # it cannot go network_mode: none like git-shadow/merge-engine. Bound the
    # pids cgroup instead as defense in depth; 512 covers the Go runtime's
    # OS-thread usage (GOMAXPROCS + blocking syscalls + net poller) under
    # normal load with headroom, while still capping a runaway/compromised
    # process well below unbounded fork territory.
    pids_limit: 512
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  git-shadow:
    image: cwso/git-shadow:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.git-shadow
    container_name: cwso-git-shadow
    environment:
      CWSO_IPC_ALLOWED_UIDS: "0,100"
      CWSO_IPC_ALLOWED_GIDS: "0,100"
    volumes:
      - cwso-runtime:/run/cwso
    tmpfs:
      - /var/lib/cwso/shadow:size=128m,mode=1777
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    # C019: git-shadow speaks only IPC over the UDS socket in the shared
    # cwso-runtime volume (see CWSO_GIT_SHADOW_SOCKET on the orchestrator and
    # merge-engine services) and has no `ports:` entry and no outbound
    # dependency — no compose service resolves it by DNS name. Denying all
    # container networking closes off any TCP/UDP egress or lateral movement
    # path from this process without touching its function.
    network_mode: "none"
    # C019: cap process/thread count (cgroup pids controller) as defense in
    # depth against a runaway/compromised process inside this container;
    # 128 is well above this single-purpose Rust sidecar's steady-state
    # thread count (see deploy/Dockerfile.git-shadow — no subprocess spawning).
    pids_limit: 128

  merge-engine:
    image: cwso/merge-engine:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.merge-engine
    container_name: cwso-merge-engine
    environment:
      CWSO_MERGE_ENGINE_SOCKET: "/run/cwso/merge-engine.sock"
      CWSO_GIT_SHADOW_SOCKET: "/run/cwso/git-shadow.sock"
      CWSO_IPC_ALLOWED_UIDS: "0,100"
      CWSO_IPC_ALLOWED_GIDS: "0,100"
    volumes:
      - cwso-runtime:/run/cwso
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    # C019: same rationale as git-shadow above — merge-engine talks to
    # git-shadow exclusively via the UDS socket on the shared cwso-runtime
    # volume (CWSO_GIT_SHADOW_SOCKET), publishes no ports, and is not
    # resolved by DNS name from any other service. No network needed.
    network_mode: "none"
    # C019: same rationale as git-shadow above — bound the pids cgroup as
    # defense in depth for this single-purpose Rust sidecar.
    pids_limit: 128

  # Opt-in Phase 9 rollout/Polar capture sidecar (ADR-010, T132). Genuinely optional per
  # docs/plans/plan-cwso-v1.0-roadmap.md §2.4 — not part of the default stack. Start
  # explicitly with: docker compose -f deploy/docker-compose.yml --profile rollout up -d
  rollout:
    image: cwso/rollout:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rollout
    container_name: cwso-rollout
    profiles: ["rollout"]
    ports:
      - "8787:8787"
    environment:
      # deploy/Dockerfile.rollout's baked-in HEALTHCHECK probes GET /healthz, but that
      # route only exists once the proxy HTTP listener starts (services/cwso-rollout/
      # src/main.rs) — with CWSO_ROLLOUT_PROXY_ENABLED unset/false the binary runs
      # IPC-only and parks with no HTTP server at all. Enable it so the opt-in service
      # is actually health-checkable.
      CWSO_ROLLOUT_PROXY_ENABLED: "true"
      # Placeholder upstream for local/dev compose only. Only validated for scheme/host
      # at process startup (services/cwso-rollout/src/security.rs) — never dialed by
      # /healthz — so the .invalid TLD is safe here. Override with a real provider URL
      # to exercise the proxy end-to-end.
      CWSO_ROLLOUT_UPSTREAM_URL: "${CWSO_ROLLOUT_UPSTREAM_URL:-https://rollout-upstream.invalid/v1}"
      # HTTP listener bind address for the proxy (services/cwso-rollout/src/config.rs);
      # default matches the binary's own built-in default (HTTP_BIND_DEFAULT), so this
      # is documentation + an override point, not a behavior change.
      CWSO_ROLLOUT_HTTP_BIND: "${CWSO_ROLLOUT_HTTP_BIND:-127.0.0.1:8787}"
      # UDS control-plane path, matching the name the orchestrator now also reads via
      # CWSO_ROLLOUT_SOCKET (orchestrator/internal/config/config.go, set on the
      # orchestrator service as of C014) for future trajectory-drain wiring.
      CWSO_ROLLOUT_SOCKET: "/run/cwso/rollout.sock"
    volumes:
      - cwso-runtime:/run/cwso
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m
    # C019: rollout is a network-facing proxy (publishes 8787, dials the
    # upstream provider URL) so it cannot go network_mode: none. Bound the
    # pids cgroup as defense in depth; 256 is generous headroom for this
    # single-purpose Rust proxy sidecar.
    pids_limit: 256
    # No explicit healthcheck block here: deploy/Dockerfile.rollout already owns the
    # HEALTHCHECK contract at the image level (T170 fix), so compose defers to it
    # rather than duplicating/re-probing GET /healthz.
    # Exception note: unlike orchestrator/git-shadow, this service does NOT mount a
    # writable path for CWSO_ROLLOUT_TRAJECTORY_STORE_PATH (/data/parquet-store). The
    # Parquet trajectory store is opt-in via CWSO_ROLLOUT_TRAJECTORY_STORE_ENABLED
    # (default false, unset here), so no writes are attempted under read_only: true;
    # enabling that flag would additionally require a persistent named volume at
    # /data/parquet-store (tmpfs would silently drop captured trajectories on restart).

volumes:
  cwso-runtime:

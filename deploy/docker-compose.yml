name: cwso

# T191 follow-up (Tech Lead review, MR !132): this used to be a top-level
# Compose `secrets:` stanza with `file: ../.env.jwt.dev`, consumed by the
# `orchestrator` service's own `secrets:` block. Live-verified against this
# stack's target Docker/Compose versions that plain (non-Swarm) Compose
# `secrets: file:` is implemented as a host bind mount under the hood, with
# the exact same "Engine silently auto-creates an empty directory for a
# missing bind-mount source" behavior documented on `workspace-check` below
# -- reproduced independently of (and in addition to) the `jwt-secret-fix`
# bug this follow-up otherwise fixes: even with `jwt-secret-fix` no longer
# touching the host file directly (see its own comment below), a genuinely
# missing `.env.jwt.dev` still got auto-vivified into a root-owned host
# directory purely from `orchestrator`'s own `secrets:` reference, because
# Compose creates every service's containers (and materializes their
# mounts) up front, before honoring `depends_on` *start* ordering -- so
# `jwt-secret-fix` completing first does not protect a sibling service's own
# independent bind of the same host path.
#
# Fix: stop bind-mounting the host `.env.jwt.dev` into any container
# directly. `jwt-secret-fix` (below) is the only service that touches the
# host file (via the existing parent-directory-mount pattern), and it
# stages a copy into the `cwso-jwt-secret` *named* Docker volume at
# `/run/secrets/jwt_secret`. `orchestrator` mounts that named volume
# read-only at the same in-container path `config.go` already expects
# (`/run/secrets/jwt_secret`, unchanged -- config.go itself is not touched).
# Named volumes are managed entirely inside Docker's storage area, not
# sourced from a host path, so there is no missing-source-path for the
# Engine to auto-vivify against -- this eliminates the whole bug class for
# the JWT secret, rather than only the half of it `jwt-secret-fix` alone
# could reach.
services:
  # C015: pre-flight validation that CWSO_WORKSPACE_HOST (or the sample-workspace
  # default) resolves to a real, non-empty directory on the host BEFORE the
  # orchestrator container starts, gating it via `depends_on: condition:
  # service_completed_successfully` below.
  #
  # Why a check container rather than relying on the bind mount to fail on a
  # missing path: verified live against this stack's target Docker/Compose
  # versions that a missing bind-mount source is NOT rejected -- Docker Engine
  # silently creates an empty, root-owned directory at the missing host path
  # instead of failing (this reproduces both with plain `docker run -v`/
  # `--mount type=bind` and with Compose's own long-syntax `bind:
  # create_host_path: false`, which is documented to prevent exactly this but is
  # tracked as ineffective for local/non-Swarm `up` on the installed versions --
  # see https://github.com/docker/compose/issues/13602). So "the mount
  # succeeded" is not proof the host path existed; a separate, positive check is
  # required.
  #
  # What is checked instead: non-emptiness. A real repository -- even a fresh
  # `git init` with zero commits -- always contains at least `.git/`; the
  # sample-workspace default always contains `hello.txt`; a directory Docker
  # silently auto-created for a missing/mistyped CWSO_WORKSPACE_HOST is always
  # completely empty. This is a reliable signal independent of the Engine/
  # Compose auto-create behavior above, and does not require mounting anything
  # beyond the workspace path itself (no broader host filesystem access).
  workspace-check:
    image: alpine:3.20
    container_name: cwso-workspace-check
    volumes:
      - ${CWSO_WORKSPACE_HOST:-../sample-workspace}:/workspace-check:ro
    command:
      - sh
      - -c
      - |
        if [ -z "$$(ls -A /workspace-check 2>/dev/null)" ]; then
          echo "FATAL: CWSO workspace path is missing or empty." >&2
          echo "  CWSO_WORKSPACE_HOST (defaults to ../sample-workspace) resolves to an empty directory." >&2
          echo "  This usually means the host path does not exist -- Docker silently created an" >&2
          echo "  empty directory there instead of failing outright." >&2
          echo "  Set CWSO_WORKSPACE_HOST to the existing path of your repository and retry, e.g.:" >&2
          echo "    CWSO_WORKSPACE_HOST=/path/to/your/repo docker compose -f deploy/docker-compose.yml up -d" >&2
          exit 1
        fi
        echo "workspace check OK: $$(ls -A /workspace-check | wc -l) entries found in workspace"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    network_mode: "none"
    # C015: trivial, short-lived shell check -- generous headroom over its
    # actual single-process footprint, same defense-in-depth rationale as the
    # other services' pids_limit values in this file.
    pids_limit: 16

  # T191: pre-flight fixup for the .env.jwt.dev -> /run/secrets/jwt_secret
  # permission mismatch. scripts/cwso-bootstrap-secrets.sh (C012) writes
  # .env.jwt.dev chmod 600, owned by whatever host user ran the bootstrap
  # script; the orchestrator (below) runs as the non-root `cwso` user with
  # `cap_drop: ["ALL"]` (C019), so it cannot read a file owned by some other
  # host uid without help. This service does the one privileged operation
  # (chown to the orchestrator image's own `cwso` uid/gid, looked up live
  # from the image's /etc/passwd, not hardcoded -- Alpine assigns system
  # uid/gid dynamically based on base-image state, and this codebase had at
  # least one existing example of a hardcoded-vs-actual uid/gid drift:
  # git-shadow/merge-engine's CWSO_IPC_ALLOWED_GIDS below used to be "0,100"
  # while the orchestrator image's actual cwso gid is 101 as of alpine:3.20 --
  # out of scope for T191 when this comment was written, corrected separately
  # under T197 to "0,101", with scripts/check-ipc-gid-drift.sh added as a
  # regression check against this drifting again on a future rebuild) that an unprivileged host user cannot
  # (verified live: `chgrp` as the host user fails with "Operation not
  # permitted"), in its own throwaway, capability-minimal container, without
  # ever weakening the orchestrator's own cap_drop/read_only/
  # no-new-privileges posture, without making the file group- or
  # world-readable on the host, and without touching config.go's
  # file-based-secret-over-env-var precedence (T029) or its fail-closed
  # validation.
  #
  # T191 follow-up (Tech Lead review, MR !132) -- two related bugs found by
  # live reproduction, both fixed together here:
  #
  # 1. This service originally bind-mounted the secret *file* directly --
  #    `../.env.jwt.dev:/secret/jwt_secret` -- and the orchestrator (below)
  #    separately consumed it via a top-level Compose `secrets: file:`
  #    stanza, which (verified live, this stack's target Docker/Compose
  #    versions) is *also* implemented as a host bind mount outside Swarm
  #    mode. Both reproduce the same "Engine silently auto-creates an empty
  #    directory for a missing bind-mount source" behavior already
  #    documented on `workspace-check` above: when `.env.jwt.dev` genuinely
  #    does not exist (fresh clone, bootstrap not yet run), the Engine
  #    auto-vivifies an empty directory at the host path *before* any
  #    in-container script gets to run an existence check -- so "the mount
  #    succeeded" was never proof the file existed, for either service.
  #    Worse: `depends_on: condition: service_completed_successfully` below
  #    only gates *start* order -- Compose still creates every service's
  #    containers (and materializes their mounts) up front for a single
  #    `docker compose up` invocation, so fixing only this service's own
  #    mount does not stop `orchestrator`'s independent `secrets:` mount
  #    from corrupting the host path regardless of which service "wins" the
  #    race. This corrupts the host filesystem (leaves a container-uid-owned
  #    directory where a file belongs) and breaks
  #    scripts/cwso-bootstrap-secrets.sh's recovery path (it hard-fails
  #    trying to write a regular file over an existing directory).
  #
  # 2. Fix: stop bind-mounting the host `.env.jwt.dev` path into *any*
  #    container. This service now mounts the *parent* directory (the repo
  #    root, which always exists -- this compose file lives one level below
  #    it) read-write, and tests for the named file *inside* that
  #    already-existing mount before touching anything -- a missing file
  #    inside an existing directory mount cannot trigger the Engine's
  #    auto-vivify behavior (there is no missing *source path* to
  #    fabricate; only a missing source path itself can trigger it). If
  #    present, it copies (not moves -- the host original is left in place)
  #    the secret into the `cwso-jwt-secret` named Docker volume at
  #    `/run/secrets/jwt_secret`, owned by the looked-up `cwso` uid/gid,
  #    mode 600. The orchestrator (below) mounts that same named volume
  #    read-only at the identical in-container path `config.go` already
  #    expects (unchanged). Named volumes are managed entirely inside
  #    Docker's own storage area, not sourced from any host path, so there
  #    is no missing-source-path for either service's mount to auto-vivify
  #    against -- this closes the bug for both services at once, rather than
  #    just the half this service alone could reach. Defense in depth: if
  #    the path inside the parent-dir mount is a directory rather than a
  #    regular file, that can now only mean a *pre-fix* run of this helper
  #    (or the pre-fix orchestrator `secrets:` mount) already corrupted it,
  #    on a host that ran an older version of this compose file at some
  #    point in the past -- refuse to touch it (clear, actionable error) and
  #    best-effort `rmdir` it if empty, so
  #    scripts/cwso-bootstrap-secrets.sh's recovery path works cleanly again
  #    with no manual intervention in the common case. That `rmdir` can
  #    still fail with EACCES on some hosts (removing a directory entry
  #    needs write permission on its *parent* -- the host-owned repo root --
  #    which this container's deliberately narrow capability set does not
  #    bypass; see the `cap_add` comment below for why CAP_DAC_OVERRIDE is
  #    not granted just for this legacy-cleanup edge case). When that
  #    happens the script falls back to a clear one-line manual instruction
  #    instead of a raw permission-denied error.
  #
  # Idempotent and gated throughout: does nothing but exit 0 if
  # .env.jwt.dev does not exist yet (e.g. bootstrap was skipped) --
  # config.go's existing fail-closed check (reading an empty/absent
  # /run/secrets/jwt_secret inside the named volume) remains the single
  # source of truth for "no secret", not this service.
  jwt-secret-fix:
    image: cwso/orchestrator:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.orchestrator
    container_name: cwso-jwt-secret-fix
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        src=/secret-parent/.env.jwt.dev
        dst=/run/secrets/jwt_secret

        if [ ! -e "$$src" ]; then
          echo "[OK] .env.jwt.dev not present yet -- nothing to stage (orchestrator will fail closed as designed)"
          exit 0
        fi

        if [ -d "$$src" ]; then
          # A directory here can now only be a stray leftover from a pre-fix
          # run of this helper (or the pre-fix orchestrator secrets: mount) --
          # never touch it as if it were the secret. Best-effort cleanup: this
          # container deliberately does not hold CAP_DAC_OVERRIDE (see
          # cap_add comment below), so removing a directory entry it doesn't
          # have write access to via its parent (the repo root, host-owned)
          # can fail with EACCES even though CAP_CHOWN/CAP_FOWNER are held --
          # rmdir is gated on the *parent* directory's write permission, which
          # those two capabilities do not bypass. Fall back to a clear manual
          # instruction rather than escalating capabilities for this
          # legacy-cleanup edge case.
          if [ -n "$$(ls -A "$$src" 2>/dev/null)" ]; then
            echo "[ERROR] .env.jwt.dev is a non-empty directory, not a file -- refusing to touch it. Remove it manually, then rerun scripts/cwso-bootstrap-secrets.sh." >&2
            exit 1
          fi
          if rmdir "$$src" 2>/dev/null; then
            echo "[FIXED] .env.jwt.dev was a stray empty directory (leftover from a pre-fix run) -- removed it. Rerun scripts/cwso-bootstrap-secrets.sh to generate the secret." >&2
            exit 0
          fi
          echo "[ERROR] .env.jwt.dev is a stray empty directory (leftover from a pre-fix run), not a file -- refusing to touch it, and could not remove it automatically (insufficient permission on its parent directory). Remove it manually on the host (e.g. 'rmdir .env.jwt.dev'), then rerun scripts/cwso-bootstrap-secrets.sh." >&2
          exit 1
        fi

        if [ ! -f "$$src" ]; then
          echo "[ERROR] .env.jwt.dev exists but is not a regular file (unexpected type) -- refusing to touch it." >&2
          exit 1
        fi

        u="$$(id -u cwso)"
        g="$$(id -g cwso)"
        cp "$$src" "$$dst.tmp"
        chown "$$u:$$g" "$$dst.tmp"
        chmod 600 "$$dst.tmp"
        mv "$$dst.tmp" "$$dst"
        echo "[OK] staged .env.jwt.dev into the jwt_secret volume, owned uid=$$u gid=$$g (mode 600, host file untouched)"
    volumes:
      - ..:/secret-parent:rw
      - cwso-jwt-secret:/run/secrets:rw
    user: "0:0"
    read_only: true
    cap_drop: ["ALL"]
    # CHOWN/FOWNER: set ownership+mode on the staged copy in the named volume.
    # DAC_READ_SEARCH: this service now *reads* .env.jwt.dev's content (to
    # copy it into the named volume) rather than only mutating its metadata
    # in place -- the host file is mode 600, owned by whatever host user ran
    # scripts/cwso-bootstrap-secrets.sh, and this container runs as uid 0 but
    # deliberately without CAP_DAC_OVERRIDE (that would grant a much broader
    # bypass of all DAC checks, write included); DAC_READ_SEARCH is the
    # narrowest capability that permits reading a file this container
    # doesn't own without weakening anything else. The host file's owner/mode
    # are never modified by this service (verified live) -- only the
    # in-volume copy is chowned/chmoded.
    cap_add: ["CHOWN", "FOWNER", "DAC_READ_SEARCH"]
    security_opt:
      - no-new-privileges:true
    network_mode: "none"
    pids_limit: 16

  orchestrator:
    image: cwso/orchestrator:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.orchestrator
    container_name: cwso-orchestrator
    ports:
      - "8080:8080"
    environment:
      CWSO_TRANSPORT: "http"
      CWSO_HTTP_ADDR: ":8080"
      CWSO_LOG_LEVEL: "info"
      CWSO_JWT_ALG: "HS256"  # RS256 is not supported in this build
      CWSO_JWT_ISSUER: "cwso"
      CWSO_JWT_AUDIENCE: "cwso-mcp"
      CWSO_ALLOWED_ORIGINS: "http://localhost,http://127.0.0.1,http://localhost:8080,http://docker:8080"
      CWSO_WORKSPACE: "/workspace"
      CWSO_GIT_SHADOW_SOCKET: "/run/cwso/git-shadow.sock"
      CWSO_MERGE_ENGINE_SOCKET: "/run/cwso/merge-engine.sock"
      CWSO_DASHBOARD_TOKEN: "${CWSO_DASHBOARD_TOKEN:-}"
      # --- C014: folded from scripts/cwso-enable-all-features.sh (deprecated) ---
      # Phase 6: hardware-aware dispatch (orchestrator/internal/config/config.go).
      # CWSO_HAL_SOCKET points at a cwso-hal sidecar socket path; no such service is
      # defined in this compose file, so hardware-aware dispatch degrades to shadow
      # mode (see the field comment on Config.HALSocket) rather than failing startup.
      CWSO_HAL_SOCKET: "/run/cwso/hal.sock"
      CWSO_HHD_CAPABILITY_REGISTRY_ENABLED: "${CWSO_HHD_CAPABILITY_REGISTRY_ENABLED:-true}"
      CWSO_HHD_DECISION_TELEMETRY_ENABLED: "${CWSO_HHD_DECISION_TELEMETRY_ENABLED:-true}"
      CWSO_HHD_TELEMETRY_REDACTION_ENABLED: "${CWSO_HHD_TELEMETRY_REDACTION_ENABLED:-true}"
      CWSO_HHD_POLICY_ENGINE_V2_ENABLED: "${CWSO_HHD_POLICY_ENGINE_V2_ENABLED:-true}"
      CWSO_HHD_HARDWARE_AWARE_DISPATCH_ENABLED: "${CWSO_HHD_HARDWARE_AWARE_DISPATCH_ENABLED:-true}"
      CWSO_HHD_EVENT_MONITOR_ENABLED: "${CWSO_HHD_EVENT_MONITOR_ENABLED:-true}"
      # eBPF requires host kernel privileges not granted to this container
      # (cap_drop: ALL); keep off by default same as the deprecated script.
      CWSO_HHD_EVENT_MONITOR_EBPF_ENABLED: "${CWSO_HHD_EVENT_MONITOR_EBPF_ENABLED:-false}"
      # Optional assists — each requires extra assets/backends not provisioned by this
      # compose file (WASM module path/hash, SSM/quantized backends); off by default
      # same as the deprecated script.
      CWSO_HHD_SPARSE_QUANTIZED_ASSIST_ENABLED: "${CWSO_HHD_SPARSE_QUANTIZED_ASSIST_ENABLED:-false}"
      CWSO_HHD_SSM_ASSIST_ENABLED: "${CWSO_HHD_SSM_ASSIST_ENABLED:-false}"
      CWSO_HHD_WASM_SCORING_ENABLED: "${CWSO_HHD_WASM_SCORING_ENABLED:-false}"
      # Phase 7: sparse micro-agents + AST spike monitor.
      # CWSO_SPARSE_SOCKET has no listening cwso-sparse service in this compose file
      # (same limitation as CWSO_HAL_SOCKET above); config.go requires it non-empty
      # whenever CWSO_SPARSE_AGENTS_ENABLED=true, so it must stay paired with it.
      CWSO_SPARSE_AGENTS_ENABLED: "${CWSO_SPARSE_AGENTS_ENABLED:-true}"
      CWSO_SPARSE_SOCKET: "/run/cwso/sparse.sock"
      CWSO_SPARSE_QUALITY_GUARDRAIL_ENABLED: "${CWSO_SPARSE_QUALITY_GUARDRAIL_ENABLED:-true}"
      CWSO_AST_SPIKE_MONITOR_ENABLED: "${CWSO_AST_SPIKE_MONITOR_ENABLED:-true}"
      CWSO_AST_SPIKE_RESOURCES_ENABLED: "${CWSO_AST_SPIKE_RESOURCES_ENABLED:-true}"
      # Phase 9: rollout / Polar (orchestrator-side flags; cwso-rollout sidecar's own
      # proxy env lives on the `rollout` service block below, unchanged from C011).
      CWSO_ROLLOUT_API_ENABLED: "${CWSO_ROLLOUT_API_ENABLED:-true}"
      CWSO_ROLLOUT_REWARD_ENABLED: "${CWSO_ROLLOUT_REWARD_ENABLED:-true}"
      CWSO_ROLLOUT_KV_PREFIX_ROUTER_ENABLED: "${CWSO_ROLLOUT_KV_PREFIX_ROUTER_ENABLED:-true}"
      CWSO_ROLLOUT_SOCKET: "/run/cwso/rollout.sock"
    depends_on:
      workspace-check:
        condition: service_completed_successfully
      jwt-secret-fix:
        condition: service_completed_successfully
    volumes:
      # C015: CWSO_WORKSPACE_HOST points the orchestrator at the developer's own
      # repository on the host; defaults to ../sample-workspace so the smoke
      # test needs no configuration. Mount is read-write (rw) -- see
      # docs/user/README.md, "Point CWSO at your own repository" (Daily use), for
      # what read-write means in practice (shadow workspaces, not this mount,
      # are where agent edits actually land -- this mount is the source of
      # truth agents branch *from*) and how to append `:ro` here instead for a
      # deliberately read-only deployment. Existence/non-emptiness of the host
      # path is validated by the `workspace-check` service above before this
      # container starts.
      - ${CWSO_WORKSPACE_HOST:-../sample-workspace}:/workspace:rw
      - cwso-runtime:/run/cwso
      # T191 follow-up: replaces the old top-level Compose `secrets: -
      # jwt_secret` reference (see the comment at the top of this file for
      # why). `jwt-secret-fix` stages the JWT secret into this named volume
      # at exactly this path; config.go reads `/run/secrets/jwt_secret`
      # unchanged. Mounted read-only here -- only jwt-secret-fix writes to it.
      - cwso-jwt-secret:/run/secrets:ro
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m
    # C019: the orchestrator publishes 8080 and dials the docker socket path
    # configured by CWSO_DOCKER_HOST when CWSO_SANDBOX_RUNNER is enabled, so
    # it cannot go network_mode: none like git-shadow/merge-engine. Bound the
    # pids cgroup instead as defense in depth; 512 covers the Go runtime's
    # OS-thread usage (GOMAXPROCS + blocking syscalls + net poller) under
    # normal load with headroom, while still capping a runaway/compromised
    # process well below unbounded fork territory.
    pids_limit: 512
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  git-shadow:
    image: cwso/git-shadow:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.git-shadow
    container_name: cwso-git-shadow
    environment:
      CWSO_IPC_ALLOWED_UIDS: "0,100"
      # T197: corrected from the stale "0,100" -- live-reverified (`docker run
      # --rm --entrypoint id cwso/orchestrator:dev cwso`) that the
      # orchestrator image's actual `cwso` group is gid=101, not 100 (uid and
      # gid are assigned independently by Alpine's `addgroup -S`/`adduser -S`
      # in deploy/Dockerfile.orchestrator and are not guaranteed to match).
      # This was latent drift, not an active gap: allows() in
      # services/cwso-git-shadow/src/main.rs is `uid OR gid`, and the UID
      # entry above already matched, so the orchestrator's IPC connections
      # were never actually blocked by the wrong GID value. Regression check:
      # scripts/check-ipc-gid-drift.sh (asserts this value against the live
      # image so this can't silently drift again).
      CWSO_IPC_ALLOWED_GIDS: "0,101"
    volumes:
      - cwso-runtime:/run/cwso
    tmpfs:
      - /var/lib/cwso/shadow:size=128m,mode=1777
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    # C019: git-shadow speaks only IPC over the UDS socket in the shared
    # cwso-runtime volume (see CWSO_GIT_SHADOW_SOCKET on the orchestrator and
    # merge-engine services) and has no `ports:` entry and no outbound
    # dependency — no compose service resolves it by DNS name. Denying all
    # container networking closes off any TCP/UDP egress or lateral movement
    # path from this process without touching its function.
    network_mode: "none"
    # C019: cap process/thread count (cgroup pids controller) as defense in
    # depth against a runaway/compromised process inside this container;
    # 128 is well above this single-purpose Rust sidecar's steady-state
    # thread count (see deploy/Dockerfile.git-shadow — no subprocess spawning).
    pids_limit: 128

  merge-engine:
    image: cwso/merge-engine:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.merge-engine
    container_name: cwso-merge-engine
    environment:
      CWSO_MERGE_ENGINE_SOCKET: "/run/cwso/merge-engine.sock"
      CWSO_GIT_SHADOW_SOCKET: "/run/cwso/git-shadow.sock"
      CWSO_IPC_ALLOWED_UIDS: "0,100"
      # T197: same fix and rationale as git-shadow's CWSO_IPC_ALLOWED_GIDS
      # above -- corrected stale "0,100" to the live-reverified gid=101;
      # latent drift only (allows() in services/cwso-merge-engine/src/ipc.rs
      # is `uid OR gid` and the UID entry already matched). Regression check:
      # scripts/check-ipc-gid-drift.sh.
      CWSO_IPC_ALLOWED_GIDS: "0,101"
    volumes:
      - cwso-runtime:/run/cwso
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    # C019: same rationale as git-shadow above — merge-engine talks to
    # git-shadow exclusively via the UDS socket on the shared cwso-runtime
    # volume (CWSO_GIT_SHADOW_SOCKET), publishes no ports, and is not
    # resolved by DNS name from any other service. No network needed.
    network_mode: "none"
    # C019: same rationale as git-shadow above — bound the pids cgroup as
    # defense in depth for this single-purpose Rust sidecar.
    pids_limit: 128

  # Opt-in Phase 9 rollout/Polar capture sidecar (ADR-010, T132). Genuinely optional per
  # docs/plans/plan-cwso-v1.0-roadmap.md §2.4 — not part of the default stack. Start
  # explicitly with: docker compose -f deploy/docker-compose.yml --profile rollout up -d
  rollout:
    image: cwso/rollout:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rollout
    container_name: cwso-rollout
    profiles: ["rollout"]
    ports:
      - "8787:8787"
    environment:
      # deploy/Dockerfile.rollout's baked-in HEALTHCHECK probes GET /healthz, but that
      # route only exists once the proxy HTTP listener starts (services/cwso-rollout/
      # src/main.rs) — with CWSO_ROLLOUT_PROXY_ENABLED unset/false the binary runs
      # IPC-only and parks with no HTTP server at all. Enable it so the opt-in service
      # is actually health-checkable.
      CWSO_ROLLOUT_PROXY_ENABLED: "true"
      # Placeholder upstream for local/dev compose only. Only validated for scheme/host
      # at process startup (services/cwso-rollout/src/security.rs) — never dialed by
      # /healthz — so the .invalid TLD is safe here. Override with a real provider URL
      # to exercise the proxy end-to-end.
      CWSO_ROLLOUT_UPSTREAM_URL: "${CWSO_ROLLOUT_UPSTREAM_URL:-https://rollout-upstream.invalid/v1}"
      # HTTP listener bind address for the proxy (services/cwso-rollout/src/config.rs);
      # default matches the binary's own built-in default (HTTP_BIND_DEFAULT), so this
      # is documentation + an override point, not a behavior change.
      CWSO_ROLLOUT_HTTP_BIND: "${CWSO_ROLLOUT_HTTP_BIND:-127.0.0.1:8787}"
      # UDS control-plane path, matching the name the orchestrator now also reads via
      # CWSO_ROLLOUT_SOCKET (orchestrator/internal/config/config.go, set on the
      # orchestrator service as of C014) for future trajectory-drain wiring.
      #
      # SEC-C044-001 (Security review of C044, fixed here): this value is now
      # genuinely unreachable. Below, the `cwso-runtime:/run/cwso` volume mount that
      # backed this path has been removed, and `read_only: true` means the image's own
      # `/run/cwso` directory (deploy/Dockerfile.rollout) is not writable either — the
      # IPC listener thread in services/cwso-rollout/src/main.rs (`ipc::run`) will fail
      # to bind() this socket at startup and log one non-fatal error
      # ("cwso-rollout IPC server exited"); the HTTP proxy is unaffected and starts
      # normally. Left set (rather than unset) deliberately: config.rs's own built-in
      # default (SOCKET_DEFAULT) resolves to this exact same path, so unsetting this
      # var would not change the behavior above, only make the intent less explicit to
      # a future reader. If/when a real trajectory-drain feature needs this control
      # plane, it must come back with its own deliberately-scoped writable mount (see
      # the removed-volume note below) — not a re-add of the shared cwso-runtime mount.
      CWSO_ROLLOUT_SOCKET: "/run/cwso/rollout.sock"
    # SEC-C044-001 (HIGH, security review of C044): this service previously mounted the
    # same `cwso-runtime` named volume that backs both the git-shadow and merge-engine
    # UDS sockets (`/run/cwso/git-shadow.sock`, `/run/cwso/merge-engine.sock`). Both
    # sidecars' `IpcAuthzPolicy::allows()` (services/cwso-git-shadow/src/main.rs,
    # services/cwso-merge-engine/src/ipc.rs) authorizes a peer if its uid OR its gid is
    # allow-listed. `rollout`'s image (deploy/Dockerfile.rollout, Debian
    # `addgroup --system` / `adduser --system`) coincidentally lands on the identical
    # uid=100/gid=101 as the orchestrator's own Alpine-assigned `cwso` identity, which is
    # exactly what CWSO_IPC_ALLOWED_UIDS/GIDS on those two sidecars allow-list — so a
    # compromised `rollout` container, despite having zero code today that dials either
    # socket (see comment above; this was speculative wiring for a future
    # trajectory-drain feature that doesn't exist yet), would have passed both sidecars'
    # authorization checks purely by identity coincidence. No volume, no reachable
    # sockets: `rollout` has no filesystem path to either `.sock` file at all now. A
    # future feature that legitimately needs this access must mount a distinct volume
    # (or a narrowly-scoped subset of this one) under an identity that is deliberately
    # pinned and distinct from uid=100/gid=101 — never a reuse of that coincidental
    # match. See SECURITY.md, "Sidecar IPC authorization", for the full writeup.
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m
    # C019: rollout is a network-facing proxy (publishes 8787, dials the
    # upstream provider URL) so it cannot go network_mode: none. Bound the
    # pids cgroup as defense in depth; 256 is generous headroom for this
    # single-purpose Rust proxy sidecar.
    pids_limit: 256
    # No explicit healthcheck block here: deploy/Dockerfile.rollout already owns the
    # HEALTHCHECK contract at the image level (T170 fix), so compose defers to it
    # rather than duplicating/re-probing GET /healthz.
    # Exception note: unlike orchestrator/git-shadow, this service does NOT mount a
    # writable path for CWSO_ROLLOUT_TRAJECTORY_STORE_PATH (/data/parquet-store). The
    # Parquet trajectory store is opt-in via CWSO_ROLLOUT_TRAJECTORY_STORE_ENABLED
    # (default false, unset here), so no writes are attempted under read_only: true;
    # enabling that flag would additionally require a persistent named volume at
    # /data/parquet-store (tmpfs would silently drop captured trajectories on restart).

volumes:
  cwso-runtime:
  # T191 follow-up: staging volume for the JWT secret (see the comment at
  # the top of this file). Not host-backed, so `docker compose down -v`
  # is the only way to clear it -- consistent with cwso-runtime above.
  # POC-DEBT: File-based JWT secret (`../.env.jwt.dev`, staged into this
  # volume by jwt-secret-fix) acceptable for dev/compose; production needs
  # external secret management (Vault/SOPS) -- tracked as DEBT-REGISTER.md
  # R-1/R-2 (moved here from the removed top-level `secrets:` stanza; update
  # DEBT-REGISTER.md's `file:line` references for R-1/R-2 next time it's
  # touched -- out of this fix's file ownership).
  cwso-jwt-secret:

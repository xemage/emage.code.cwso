name: cwso

secrets:
  jwt_secret:
    file: ../.env.jwt.dev  # T029: Production must use secure secret management (Vault/SOPS)
    # POC-DEBT: File-based secret acceptable for dev/compose; prod needs external vault

services:
  orchestrator:
    image: cwso/orchestrator:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.orchestrator
    container_name: cwso-orchestrator
    ports:
      - "8080:8080"
    environment:
      CWSO_TRANSPORT: "http"
      CWSO_HTTP_ADDR: ":8080"
      CWSO_LOG_LEVEL: "info"
      CWSO_JWT_ALG: "HS256"  # RS256 is not supported in this build
      CWSO_JWT_ISSUER: "cwso"
      CWSO_JWT_AUDIENCE: "cwso-mcp"
      CWSO_ALLOWED_ORIGINS: "http://localhost,http://127.0.0.1,http://localhost:8080,http://docker:8080"
      CWSO_WORKSPACE: "/workspace"
      CWSO_GIT_SHADOW_SOCKET: "/run/cwso/git-shadow.sock"
      CWSO_MERGE_ENGINE_SOCKET: "/run/cwso/merge-engine.sock"
    secrets:
      - jwt_secret
    volumes:
      - ../sample-workspace:/workspace:ro
      - cwso-runtime:/run/cwso
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Phase 2+ sidecars (kept disabled until implemented)
  git-shadow:
    image: cwso/git-shadow:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.git-shadow
    profiles: ["phase2"]
    container_name: cwso-git-shadow
    environment:
      CWSO_IPC_ALLOWED_UIDS: "0"
      CWSO_IPC_ALLOWED_GIDS: "0"
    volumes:
      - cwso-runtime:/run/cwso
    tmpfs:
      - /var/lib/cwso/shadow:size=128m,mode=1777
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  merge-engine:
    image: cwso/merge-engine:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.merge-engine
    profiles: ["phase4"]
    container_name: cwso-merge-engine
    environment:
      CWSO_MERGE_ENGINE_SOCKET: "/run/cwso/merge-engine.sock"
      CWSO_GIT_SHADOW_SOCKET: "/run/cwso/git-shadow.sock"
      CWSO_IPC_ALLOWED_UIDS: "0"
      CWSO_IPC_ALLOWED_GIDS: "0"
    volumes:
      - cwso-runtime:/run/cwso
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

volumes:
  cwso-runtime:
